<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
</head>

<body>

    <h1>LIBRARY MANAGEMENT SYSTEM</h1>

    <h2>Search Book</h2>

    <input type="text" id="search" placeholder="Enter book name">
    <button onclick="searchBook()">Search</button>

    <h3>Available Books</h3>

    <table border="1">
        <tr>
            <th>Book ID</th>
            <th>Book Name</th>
            <th>Author</th>
            <th>Year</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Java</td>
            <td>James</td>
            <td>2024</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Python</td>
            <td>Guido</td>
            <td>2023</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Data Structures</td>
            <td>Mark</td>
            <td>2022</td>
        </tr>
    </table>

    <h2>Admin</h2>

    <button>Add Book</button>
    <button>Update Book</button>
    <button>Delete Book</button>
    <button>Issue Book</button>
    <button>Return Book</button>

    <h2>User</h2>

    <button>Login</button>
    <button>Register</button>
    <button>My Borrow History</button>
    <button>Check Fine</button>
    <button>Download Material</button>

    <script>

        function searchBook() {
            var book = document.getElementById("search").value;

            if (book == "Java" || book == "java") {
                alert("Java book is available");
            }
            else if (book == "Python" || book == "python") {
                alert("Python book is available");
            }
            else {
                alert("Book not found");
            }
        }

    </script>

</body>
</html>
