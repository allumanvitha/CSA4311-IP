<!DOCTYPE html>
<html>
<head>
    <title>StyleHub Shopping</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            text-align: center;
        }
        header {
            background-color: black;
            color: white;
            padding: 15px;
        }
        .product {
            background: white;
            display: inline-block;
            width: 200px;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
        }
        button {
            background-color: #e91e63;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>StyleHub</h1>
    <p>Your Fashion, Your Style!</p>
</header>

<h2>Our Products</h2>

<div class="product">
    <h3>Men's T-Shirt</h3>
    <p>Price: ₹500</p>
    <button onclick="addToCart(500)">Add to Cart</button>
</div>

<div class="product">
    <h3>Women's Dress</h3>
    <p>Price: ₹1200</p>
    <button onclick="addToCart(1200)">Add to Cart</button>
</div>

<div class="product">
    <h3>Shoes</h3>
    <p>Price: ₹1500</p>
    <button onclick="addToCart(1500)">Add to Cart</button>
</div>

<h2>Shopping Cart</h2>
<p>Items: <span id="count">0</span></p>
<p>Total: ₹<span id="total">0</span></p>

<script>
    let count = 0;
    let total = 0;

    function addToCart(price) {
        count++;
        total += price;

        document.getElementById("count").innerText = count;
        document.getElementById("total").innerText = total;
    }
</script>

</body>
</html>
